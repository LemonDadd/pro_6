version: "3.9"

services:
  api:
    build: .
    container_name: md2pdf-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:///./data/md2pdf.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: md2pdf
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      PDF_TTL_DAYS: 7
      SYNC_MAX_SIZE_KB: 200
      MAX_CONCURRENT_JOBS: 3
      DAILY_RATE_LIMIT: 100
      API_KEYS: "your-api-key-here,test-key-123"
      KROKI_URL: http://kroki:8000
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - minio
      - kroki

  worker:
    build: .
    container_name: md2pdf-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 -Q default
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:///./data/md2pdf.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: md2pdf
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      PDF_TTL_DAYS: 7
      KROKI_URL: http://kroki:8000
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - minio
      - kroki

  redis:
    image: redis:7-alpine
    container_name: md2pdf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: md2pdf-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  kroki:
    image: yuzutech/kroki:latest
    container_name: md2pdf-kroki
    restart: unless-stopped
    ports:
      - "8008:8000"

volumes:
  redis_data:
  minio_data:
